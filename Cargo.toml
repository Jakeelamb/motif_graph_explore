[package]
name = "assembly_theory"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.9"
petgraph = "0.7.1"
rustc-hash = "1.1.0"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
